<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conheça os Santos — Paróquia Santo Antônio de Pádua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#1A3C6A; --verde-musgo:#2F5A96; --verde-claro:#E8EEF7;
    --ouro:#B9912F; --ouro-claro:#E8C97A; --ouro-suave:#F6ECD2;
    --marfim:#F4F5F8; --papel:#FCFCFE; --tinta:#16223A; --pedra:#5E6678;
    --linha:#DCE2EA; --alerta:#9B2C2C; --alerta-bg:#F8E7E5; --ok-bg:#DCEBDF;
    --azul-topo:#0A1730; --azul-meio:#122A50;
    --sombra:0 1px 2px rgba(16,30,55,.07), 0 8px 24px rgba(16,30,55,.08);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--marfim); color:var(--tinta);
    font-family:"Archivo",system-ui,sans-serif; font-size:15px; line-height:1.5;
  }
  .num{font-family:"Barlow Condensed",sans-serif; font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif; font-weight:600; margin:0; line-height:1.1}
  a{color:var(--verde-musgo)}
  button{font-family:inherit; cursor:pointer}

  /* ---------- Cabeçalho ---------- */
  header{
    background:linear-gradient(158deg, var(--azul-topo) 0%, var(--azul-meio) 52%, var(--verde) 100%);
    color:var(--marfim); padding:26px 24px 24px; position:relative; overflow:hidden;
  }
  header::after{content:""; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 92% -10%, rgba(185,145,47,.16), transparent 58%);
    pointer-events:none}
  header.com-capa{
    background:linear-gradient(rgba(10,23,48,.74), rgba(10,23,48,.88)), var(--capa);
    background-size:cover; background-position:center; background-repeat:no-repeat;
    padding-top:40px; padding-bottom:30px;
  }
  header.com-capa::after{display:none}
  .header-top{display:flex; align-items:center; gap:22px; position:relative; z-index:1}
  .brasao{height:108px; width:auto; flex-shrink:0; border-radius:12px;
    border:1px solid rgba(255,255,255,.18); box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .header-texto{min-width:0}
  .wrap{max-width:1080px; margin:0 auto}
  .eyebrow{font-family:"Barlow Condensed",sans-serif; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; font-size:15px; color:var(--ouro-claro); margin-bottom:6px}
  header h1{font-size:clamp(26px,4.6vw,40px); font-weight:900; color:var(--marfim)}
  header h1 em{font-style:italic; font-weight:400; color:var(--ouro-claro)}
  .periodo{margin-top:6px; color:#C8D6EC; font-size:15px}
  @media(max-width:560px){
    .header-top{gap:14px} .brasao{height:76px}
  }

  /* medalhão de equilíbrio */
  .selo{position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:18px;
    margin-top:22px; align-items:stretch}
  .selo-card{background:rgba(255,255,255,.07); border:1px solid rgba(232,201,122,.25);
    border-radius:14px; padding:14px 18px; min-width:128px; backdrop-filter:blur(2px)}
  .selo-card .k{font-family:"Barlow Condensed",sans-serif; font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; color:#AEC2DE}
  .selo-card .v{font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:34px;
    color:var(--marfim); line-height:1; margin-top:2px}
  .selo-card .v small{font-size:15px; color:var(--ouro-claro); font-weight:600}

  /* ---------- Layout ---------- */
  main{max-width:1080px; margin:0 auto; padding:24px}
  .barra{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px}
  .tabs{display:flex; gap:2px; background:#EDE9DC; padding:4px; border-radius:12px; flex-wrap:wrap}
  .tab{border:0; background:transparent; padding:9px 16px; border-radius:9px;
    font-weight:600; color:var(--pedra); font-size:14px}
  .tab[aria-selected="true"]{background:var(--papel); color:var(--verde); box-shadow:var(--sombra)}
  .spacer{flex:1}
  .btn{border:1px solid var(--linha); background:var(--papel); color:var(--tinta);
    padding:9px 14px; border-radius:10px; font-weight:600; font-size:14px;
    display:inline-flex; align-items:center; gap:7px; transition:.15s}
  .btn:hover{border-color:var(--verde-musgo); color:var(--verde)}
  .btn-ouro{background:var(--ouro); border-color:var(--ouro); color:#fff}
  .btn-ouro:hover{background:#a47f24; color:#fff}
  .btn-verde{background:var(--verde); border-color:var(--verde); color:var(--marfim)}
  .btn-verde:hover{background:#122A50; color:var(--marfim)}

  .panel{display:none}
  .panel.ativo{display:block; animation:fade .35s ease}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  /* busca */
  .busca{position:relative; flex:1; min-width:220px; max-width:340px}
  .busca input{width:100%; padding:10px 14px 10px 38px; border:1px solid var(--linha);
    border-radius:10px; font-family:inherit; font-size:14px; background:var(--papel); color:var(--tinta)}
  .busca input:focus{outline:2px solid var(--verde-musgo); outline-offset:1px; border-color:transparent}
  .busca svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--pedra)}

  /* ---------- Cards de celebração ---------- */
  .cel{background:var(--papel); border:1px solid var(--linha); border-radius:14px;
    padding:16px 18px; margin-bottom:12px; box-shadow:var(--sombra); transition:.18s}
  .cel.oculto{display:none}
  .cel-top{display:flex; gap:16px; align-items:baseline; flex-wrap:wrap}
  .data{font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:30px;
    color:var(--verde); line-height:.95; letter-spacing:.01em}
  .data small{display:block; font-size:13px; font-weight:600; color:var(--pedra);
    text-transform:uppercase; letter-spacing:.08em; margin-top:3px}
  .cel-nome{font-family:"Fraunces",serif; font-weight:600; font-size:20px; color:var(--tinta)}
  .tag{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.05em; text-transform:uppercase; padding:3px 10px; border-radius:999px;
    background:var(--ouro-suave); color:#7a5e16; border:1px solid #E6D199}
  .cel-corpo{margin-top:12px; padding-top:12px; border-top:1px dashed var(--linha);
    display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:13.5px; padding:4px 11px; border-radius:8px; background:var(--verde-claro);
    color:var(--verde); border:1px solid #CBD9EC; font-weight:500}
  .chip.match{background:var(--ouro); color:#fff; border-color:var(--ouro); font-weight:600}
  .chip.editavel{display:inline-flex; align-items:center; gap:2px; padding-right:4px}
  .chip-x{border:0; background:transparent; color:var(--verde-musgo); font-size:15px; line-height:1;
    cursor:pointer; padding:0 3px; border-radius:5px}
  .chip-x:hover{background:var(--alerta-bg); color:var(--alerta)}
  .cel-add{display:inline-flex}
  .cel-add-sel{border:1px dashed var(--ouro); background:var(--ouro-suave); color:#7a5e16;
    border-radius:8px; padding:4px 8px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer}
  .cel-aviso{margin-left:8px; color:var(--alerta); font-weight:700; font-size:13px}
  .btn.ativo{background:var(--ouro); border-color:var(--ouro); color:#fff}

  /* ---------- Tabelas ---------- */
  .tbl-wrap{overflow-x:auto; border:1px solid var(--linha); border-radius:14px; background:var(--papel)}
  table{border-collapse:collapse; width:100%; font-size:14px}
  th,td{padding:11px 14px; text-align:left; border-bottom:1px solid var(--linha)}
  thead th{background:var(--verde); color:var(--marfim); font-family:"Barlow Condensed",sans-serif;
    font-weight:600; font-size:14px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
    position:sticky; top:0; white-space:nowrap}
  thead th:hover{background:#122A50}
  tbody tr:nth-child(even){background:#F4F1E7}
  tbody tr:hover{background:var(--verde-claro)}
  td.c, th.c{text-align:center}
  .pill{display:inline-block; min-width:26px; padding:2px 8px; border-radius:999px;
    font-family:"Barlow Condensed",sans-serif; font-weight:700; background:var(--verde-claro); color:var(--verde)}

  /* ---------- Painel ---------- */
  .grid-kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:20px}
  .kpi{background:var(--papel); border:1px solid var(--linha); border-radius:14px; padding:16px 18px; box-shadow:var(--sombra)}
  .kpi .k{font-family:"Barlow Condensed",sans-serif; font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--pedra)}
  .kpi .v{font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:40px; color:var(--verde); line-height:1}
  .kpi .sub{font-size:12.5px; color:var(--pedra); margin-top:2px}
  .cartoes{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .grafico{background:var(--papel); border:1px solid var(--linha); border-radius:14px; padding:18px; box-shadow:var(--sombra)}
  .grafico h3{font-size:17px; margin-bottom:14px; color:var(--tinta)}
  .legenda{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; font-size:13px; color:var(--pedra)}
  .legenda span{display:inline-flex; align-items:center; gap:6px}
  .dot{width:11px; height:11px; border-radius:3px; display:inline-block}

  .equilibrio{margin-bottom:20px; padding:16px 18px; border-radius:14px; display:flex;
    align-items:center; gap:14px; font-weight:600}
  .equilibrio.ok{background:var(--ok-bg); color:#1d4d33; border:1px solid #BcdCc4}
  .equilibrio.ruim{background:var(--alerta-bg); color:var(--alerta); border:1px solid #E9C2bd}
  .equilibrio .ic{font-size:24px}

  /* ---------- Configuração ---------- */
  .config{background:var(--papel); border:1px solid var(--linha); border-radius:14px;
    padding:20px; box-shadow:var(--sombra)}
  .config h3{font-size:18px; color:var(--verde); margin-bottom:4px}
  .config p.hint{color:var(--pedra); font-size:13.5px; margin:0 0 16px}
  .campo{margin-bottom:18px}
  .campo > label{display:block; font-weight:600; font-size:14px; margin-bottom:6px}
  textarea, input[type=number], input[type=text], select{
    font-family:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--linha);
    border-radius:9px; background:#fff; color:var(--tinta); width:100%}
  textarea{min-height:150px; resize:vertical; line-height:1.45}
  textarea:focus, input:focus, select:focus{outline:2px solid var(--verde-musgo); outline-offset:1px; border-color:transparent}
  .cfg-cel{display:grid; grid-template-columns:1.6fr 1.1fr 1fr .7fr auto; gap:8px; align-items:end; margin-bottom:8px}
  .cfg-cel label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--pedra); font-weight:600; display:block; margin-bottom:3px}
  .cfg-cel .x{border:1px solid var(--linha); background:#fff; border-radius:8px; width:38px; height:38px; color:var(--alerta); font-size:18px}
  .cfg-cel .x:hover{background:var(--alerta-bg)}
  .linha-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
  .erro-cfg{background:var(--alerta-bg); color:var(--alerta); border:1px solid #E9C2bd;
    border-radius:10px; padding:10px 14px; font-size:14px; font-weight:600; margin-bottom:14px; display:none}
  .erro-cfg.ativo{display:block}

  .roster-acoes{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
  .add-nome{display:flex; gap:8px; margin-bottom:12px}
  .add-nome input{flex:1}
  .roster{display:flex; flex-wrap:wrap; gap:8px; max-height:300px; overflow:auto;
    padding:12px; border:1px solid var(--linha); border-radius:10px; background:#fff}
  .rname{display:inline-flex; align-items:center; background:var(--verde-claro);
    border:1px solid #CBD9EC; border-radius:8px; overflow:hidden; transition:.12s}
  .rname:focus-within{border-color:var(--verde-musgo); background:#fff}
  .rname-in{border:0; background:transparent; padding:5px 2px 5px 10px; font-family:inherit;
    font-size:13.5px; color:var(--verde); font-weight:500; width:auto}
  .rname-in:focus{outline:0}
  .rname-x{border:0; background:transparent; color:var(--pedra); padding:2px 8px 2px 4px;
    font-size:17px; line-height:1; cursor:pointer}
  .rname-x:hover{color:var(--alerta)}
  .roster-vazio{color:var(--pedra); font-size:14px; padding:6px; width:100%; text-align:center}

  footer{max-width:1080px; margin:8px auto 40px; padding:0 24px; color:var(--pedra); font-size:13px}
  footer .rodape-linha{border-top:1px solid var(--linha); padding-top:14px}

  @media(max-width:720px){
    .cartoes{grid-template-columns:1fr}
    .cfg-cel{grid-template-columns:1fr 1fr; }
    .cfg-cel .x{justify-self:start}
    .selo-card{flex:1 1 calc(50% - 9px); min-width:0}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  /* ---------- Conheça os Santos ---------- */
  .santos-intro{margin-bottom:18px}
  .santos-intro h2{font-size:clamp(22px,4vw,30px); color:var(--verde)}
  .santos-intro p{color:var(--pedra); margin:6px 0 0; font-size:15px}
  .santos-filtros{display:flex; flex-direction:column; gap:12px; margin-bottom:18px}
  .santos-busca{position:relative}
  .santos-busca input{width:100%; padding:11px 14px 11px 40px; border:1px solid var(--linha); border-radius:11px; font-family:inherit; font-size:15px; background:var(--papel); color:var(--tinta)}
  .santos-busca input:focus{outline:2px solid var(--verde-musgo); outline-offset:1px; border-color:transparent}
  .santos-busca svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--pedra)}
  .santos-controles{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .santo-chip{border:1px solid var(--linha); background:var(--papel); color:var(--pedra); padding:8px 14px; border-radius:999px; font-weight:600; font-size:13px; font-family:"Barlow Condensed",sans-serif; letter-spacing:.04em; text-transform:uppercase}
  .santo-chip[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:var(--marfim)}
  .santos-ord{margin-left:auto; display:flex; align-items:center; gap:6px; color:var(--pedra); font-size:13px}
  .santos-ord select{border:1px solid var(--linha); border-radius:9px; padding:7px 9px; font-family:inherit; font-size:13.5px; background:var(--papel); color:var(--tinta)}
  .santos-grid{display:grid; grid-template-columns:1fr; gap:14px}
  @media(min-width:680px){ .santos-grid{grid-template-columns:1fr 1fr} }
  @media(min-width:1040px){ .santos-grid{grid-template-columns:1fr 1fr 1fr} }
  .santo{--cor-santo:var(--ouro); position:relative; background:var(--papel); border:1px solid var(--linha); border-radius:16px; box-shadow:var(--sombra); overflow:hidden; align-self:start}
  .santo::before{content:""; position:absolute; inset:0 auto 0 0; width:8px; background:var(--cor-santo); z-index:1}
  .santo-head{width:100%; text-align:left; border:0; background:transparent; padding:16px 16px 16px 22px; display:flex; gap:14px; align-items:center; cursor:pointer; font-family:inherit}
  .santo-head:hover{background:var(--verde-claro)}
  .medalha{flex-shrink:0; width:62px; height:62px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(150deg,var(--azul-topo),var(--verde)); color:var(--ouro-claro);
    border:3px solid var(--cor-santo); overflow:hidden; box-shadow:0 4px 12px rgba(10,23,48,.18)}
  .medalha img{width:100%; height:100%; object-fit:cover; display:block}
  .medalha-fallback{display:none; place-items:center; width:100%; height:100%}
  .medalha svg{width:30px; height:30px}
  .santo-tit{flex:1; min-width:0}
  .santo-tit .nome{font-family:"Fraunces",serif; font-weight:600; font-size:19px; color:var(--tinta); line-height:1.12; display:block}
  .santo-tit .sub{font-size:12.5px; color:var(--verde-musgo); font-weight:600; margin-top:2px; display:block}
  .santo-tit .festa{font-family:"Barlow Condensed",sans-serif; font-size:13px; color:var(--pedra); letter-spacing:.04em; text-transform:uppercase; margin-top:4px; display:block}
  .santo-seta{flex-shrink:0; color:var(--pedra); transition:transform .25s}
  .santo.aberto .santo-seta{transform:rotate(180deg)}
  .santo-corpo{display:none; padding:0 16px 18px; border-top:1px solid var(--linha)}
  .santo.aberto .santo-corpo{display:block; animation:fade .3s ease}
  .santo-sec{margin-top:14px}
  .santo-sec h4{font-family:"Barlow Condensed",sans-serif; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ouro); margin:0 0 6px; font-weight:700}
  .santo-sec p{margin:0; font-size:14.5px; line-height:1.55; color:var(--tinta)}
  .santo-tags{display:flex; flex-wrap:wrap; gap:6px}
  .santo-tags span{font-size:12.5px; padding:4px 10px; border-radius:8px; background:var(--verde-claro); color:var(--verde); border:1px solid #CBD9EC; font-weight:500}
  .biblia-lista{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
  .biblia-lista li{display:flex; gap:10px; font-size:14px; line-height:1.5; align-items:flex-start}
  .biblia-ref{flex-shrink:0; font-family:"Barlow Condensed",sans-serif; font-weight:700; color:var(--verde); background:var(--ouro-suave); border:1px solid #E6D199; border-radius:7px; padding:2px 8px; min-width:84px; text-align:center; letter-spacing:.02em}
  .trad-lista{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:1.5; color:var(--tinta)}
  .oracao{margin-top:16px; background:linear-gradient(150deg, var(--azul-topo), var(--verde)); color:var(--marfim); border-radius:12px; padding:14px 16px}
  .oracao h4{color:var(--ouro-claro)}
  .oracao p{font-family:"Fraunces",serif; font-style:italic; font-size:15px; line-height:1.5; color:#EAF1F8; margin:0}
  .santos-vazio{grid-column:1/-1; text-align:center; color:var(--pedra); padding:30px}

  /* ---------- Impressão ---------- */
  @media print{
    header{background:#fff!important; color:#000; padding:0 0 12px; border-bottom:2px solid #1A3C6A}
    header::after{display:none}
    .eyebrow{color:#1A3C6A}
    header h1, header h1 em{color:#000}
    .periodo{color:#333}
    .selo, .barra, .busca, .btn, .tabs, .equilibrio, footer{display:none!important}
    .panel{display:none!important}
    #panel-santos{display:block!important}
    .cel{box-shadow:none; border:1px solid #ccc; break-inside:avoid; margin-bottom:8px}
    .data{color:#1A3C6A}
    body{background:#fff; font-size:12px}
    .chip{background:#eef2f8; border-color:#ccc}
  }
</style>
<style>
  header .periodo{max-width:680px}
  main{padding-top:22px}
  .panel.ativo{display:block}
  @media print{
    .panel{display:block!important}
    #panel-santos{display:block!important}
    .santos-filtros{display:none!important}
    .santo{box-shadow:none; break-inside:avoid}
    .santo-corpo{display:block!important}
  }
</style>
</head>
<body>
<header id="cabecalho">

function renderSantos(){
  const grid=document.getElementById("santos-grid"); if(!grid) return;
  const q=(estado.santosBusca||"").toLowerCase().trim();
  const fl=estado.santosFiltro||"todos";
  let lista=SANTOS.filter(s=>{
    const okF=fl==="todos"||s.tags.includes(fl);
    const txt=(s.nome+" "+s.titulo+" "+s.patronato.join(" ")+" "+s.simbolos.join(" ")).toLowerCase();
    return okF && (!q||txt.includes(q));
  });
  if((estado.santosOrdem||"festa")==="az") lista.sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
  else lista.sort((a,b)=>a.ordemFesta-b.ordemFesta);
  if(!lista.length){grid.innerHTML='<div class="santos-vazio">Nenhum santo encontrado com esse filtro.</div>';return;}
  grid.innerHTML=lista.map(s=>{
    const biblia=s.biblia.map(b=>'<li><span class="biblia-ref">'+b.ref+'</span><span>'+b.desc+'</span></li>').join("");
    const trad=s.tradicao.map(t=>'<li>'+t+'</li>').join("");
    const simb=s.simbolos.map(x=>'<span>'+x+'</span>').join("");
    const patr=s.patronato.map(x=>'<span>'+x+'</span>').join("");
    const medalha=s.imagem?'<img src="'+s.imagem+'" alt="Imagem de '+s.nome+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;;this.nextElementSibling.style.display=&quot;grid&quot;"><span class="medalha-fallback">'+s.icone+'</span>':s.icone;
    return '<article class="santo" id="santo-'+s.id+'" style="--cor-santo:'+s.cor+'">'+
      '<button class="santo-head" aria-expanded="false">'+
        '<span class="medalha">'+medalha+'</span>'+
        '<span class="santo-tit"><span class="nome">'+s.nome+'</span>'+
          '<span class="sub">'+s.titulo+'</span>'+
          '<span class="festa">Festa: '+s.festa+'</span></span>'+
        '<svg class="santo-seta" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'+
      '</button>'+
      '<div class="santo-corpo">'+
        '<div class="santo-sec"><h4>Quem foi</h4><p>'+s.resumo+'</p></div>'+
        '<div class="santo-sec"><h4>Na Bíblia</h4><ul class="biblia-lista">'+biblia+'</ul></div>'+
        '<div class="santo-sec"><h4>Tradição da Igreja</h4><ul class="trad-lista">'+trad+'</ul></div>'+
        '<div class="santo-sec"><h4>Símbolos</h4><div class="santo-tags">'+simb+'</div></div>'+
        '<div class="santo-sec"><h4>Padroeiro de</h4><div class="santo-tags">'+patr+'</div></div>'+
        '<div class="oracao"><h4>Oração</h4><p>'+s.oracao+'</p></div>'+
      '</div></article>';
  }).join("");
}
const _sb=document.getElementById("santos-busca");
if(_sb)_sb.addEventListener("input",e=>{estado.santosBusca=e.target.value;renderSantos();});
const _so=document.getElementById("santos-ord");
if(_so)_so.addEventListener("change",e=>{estado.santosOrdem=e.target.value;renderSantos();});
renderSantos();

document.addEventListener("click",e=>{
  const sc=e.target.closest(".santo-chip");
  if(sc){
    estado.santosFiltro=sc.dataset.f;
    document.querySelectorAll(".santo-chip").forEach(c=>c.setAttribute("aria-pressed",c===sc?"true":"false"));
    renderSantos();
    return;
  }
  const sh=e.target.closest(".santo-head");
  if(sh){
    const card=sh.closest(".santo");
    const open=card.classList.toggle("aberto");
    sh.setAttribute("aria-expanded",open?"true":"false");
  }
});
</script>
